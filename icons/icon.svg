<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sprite Locker</title>
  <desc id="desc">Lettre F noire sur une carte lumineuse verte et cyan.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="24" x2="470" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141b4d"/>
      <stop offset="1" stop-color="#07091a"/>
    </linearGradient>
    <linearGradient id="card" x1="126" y1="104" x2="386" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ff6d0"/>
      <stop offset="0.52" stop-color="#d9ec45"/>
      <stop offset="1" stop-color="#ffdf43"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.12 0 0 0 0 0.92 0 0 0 0 0.75 0 0 0 .58 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#background)"/>
  <path d="M151 108h250l-29 316H122z" fill="#188fca" opacity=".72" transform="translate(18 11)"/>
  <path d="M127 91h264l-29 316H98z" fill="url(#card)" stroke="#f7fbff" stroke-width="12" filter="url(#glow)"/>
  <path d="M228 170h108l-9 55h-50l-6 38h44l-9 53h-44l-17 91h-69l43-237h9z" fill="#07091a"/>
</svg>
