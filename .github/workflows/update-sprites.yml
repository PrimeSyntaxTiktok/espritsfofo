name: Auto Update Fortnite Sprites & News

on:
  schedule:
    # Run every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger via "Run workflow" button in GitHub Actions UI

permissions:
  contents: write

jobs:
  update-sprites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Automated Sprites Update Script
        run: node scripts/auto-update-sprites.js

      - name: Run Automated Quality Assurance (Anti-Bug) Checks
        run: node scripts/quality-check.js

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --staged --quiet; then
            echo "No new updates or cards found. Everything is up to date!"
          else
            git commit -m "build: auto-update fortnite sprites & PWA version [skip ci]"
            git push origin main
          fi
