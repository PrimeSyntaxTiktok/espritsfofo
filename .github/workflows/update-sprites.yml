name: Auto Update Fortnite Sprites & News

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mobile-leaks-hotfix.js'
      - '.github/workflows/update-sprites.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sprites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Automated Sprites Update Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/auto-update-sprites.js

      - name: Apply Mobile Leaks Hotfix
        run: node scripts/mobile-leaks-hotfix.js

      - name: Run Automated Quality Assurance (Anti-Bug) Checks
        run: node scripts/quality-check.js

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --staged --quiet; then
            echo "No new updates or cards found. Everything is up to date!"
          else
            git commit -m "build: auto-update fortnite sprites & PWA version [skip ci]"
            git push origin main
          fi
